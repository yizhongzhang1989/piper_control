[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piper-control"
version = "0.1.0"
description = "Common robot control API, Piper X hardware adapter and physics simulator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "scipy>=1.10", "fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27", "pybullet==3.2.7", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.40"]

[project.scripts]
piper-control = "piper_control.__main__:main"

[tool.setuptools.packages.find]
include = ["piper_control*"]

[tool.setuptools.package-data]
piper_control = ["web/**/*", "web/*", "assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
